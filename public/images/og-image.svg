<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0c1730" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99A1F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Premium Abstract Lines / Shapes -->
  <circle cx="1000" cy="150" r="300" fill="#D4AF37" fill-opacity="0.03" filter="url(#glow)" />
  <circle cx="150" cy="500" r="250" fill="#00aaff" fill-opacity="0.03" filter="url(#glow)" />
  
  <path d="M-100,500 L400,200 L600,450 L1300,100" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.15" />
  <path d="M-50,550 L450,220 L650,470 L1350,120" fill="none" stroke="#00aaff" stroke-width="1" stroke-opacity="0.1" />

  <!-- Logo/Brand Graphic representation -->
  <g transform="translate(100, 180)">
    <!-- Shield/Gold Icon -->
    <path d="M 0 0 L 80 0 L 80 50 C 80 90 40 120 40 120 C 40 120 0 90 0 50 Z" fill="url(#goldGrad)" />
    <path d="M 10 10 L 70 10 L 70 48 C 70 80 40 105 40 105 C 40 105 10 80 10 48 Z" fill="#0c1730" />
    <!-- Letter R -->
    <text x="40" y="70" font-family="'Inter', 'Helvetica', 'Arial', sans-serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">R</text>
  </g>

  <!-- Text Content -->
  <g transform="translate(230, 240)">
    <!-- Brand Title -->
    <text x="0" y="0" font-family="'Inter', 'Helvetica', 'Arial', sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Recruitment Direct
    </text>
    <text x="590" y="0" font-family="'Inter', 'Helvetica', 'Arial', sans-serif" font-size="64" font-weight="800" fill="url(#goldGrad)" letter-spacing="-1">
      UK
    </text>
    
    <!-- Tagline -->
    <text x="0" y="55" font-family="'Inter', 'Helvetica', 'Arial', sans-serif" font-size="24" font-weight="600" fill="#00aaff" letter-spacing="4" fill-opacity="0.9">
      TEMPORARY • CONTRACT • PERMANENT
    </text>
    
    <!-- Details -->
    <text x="0" y="110" font-family="'Inter', 'Helvetica', 'Arial', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Supplying professional workforce solutions across Scotland and the UK since 2006.
    </text>
  </g>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.15" />
</svg>
